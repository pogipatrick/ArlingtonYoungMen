name: Update this week
on:
  schedule:
    - cron: "0 11 * * *"   # daily, early morning US time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install icalendar recurring-ical-events
      - run: python scripts/build_week.py
        env:
          ICS_URL: ${{ vars.ICS_URL }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
      - name: Commit if changed
        run: |
          git config user.name "week-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/week.json
          git diff --cached --quiet || (git commit -m "Update this week" && git push)
