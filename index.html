<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arlington Young Men</title>
<meta name="description" content="Calendar, this week's activities and to-dos for the Arlington Ward young men and their parents.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="wrap">
    <h1>Arlington Young Men</h1>
    <p class="sub">Everything for the young men and their parents, in one place.</p>
    <nav>
      <a href="#week">This week</a>
      <a href="#calendar">Calendar</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="week" class="card">
    <h2>This week</h2>
    <p class="muted" id="week-range"></p>
    <ul id="week-events" class="events"></ul>
  </section>

  <section id="calendar" class="card">
    <div class="cal-head">
      <button id="prev" class="nav-btn" aria-label="Previous month">‹</button>
      <h2 id="month-title"></h2>
      <button id="next" class="nav-btn" aria-label="Next month">›</button>
    </div>
    <div class="legend">
      <span class="tag t-ym">Young Men</span>
      <span class="tag t-youth">YM/YW</span>
      <span class="tag t-sunday">Sunday lesson</span>
      <span class="tag t-temple">Temple</span>
      <span class="tag t-stake">Stake</span>
      <span class="tag t-leaders">Leaders/councils</span>
    </div>
    <div id="grid" class="grid" aria-hidden="true"></div>
    <ul id="month-list" class="events month-list"></ul>
  </section>

</main>

<footer class="wrap muted small">Arlington Ward Young Men · Times are Pacific.</footer>

<script src="app.js"></script>
</body>
</html>
